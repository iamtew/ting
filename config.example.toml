# Copy to config.toml (gitignored) and edit before connecting.
# ting-master -config config.toml
# IRC servers, channels, owners, and SASL live in ting.db (admin UI).

database = "ting.db"
# connector = "dist/dev/ting-connector"

[identity]
nick = "ting"
user = "ting"
realname = "ting"

# Admin UI login. Required.
[control]
token = "change-me"

[admin]
listen = "127.0.0.1:8080"
