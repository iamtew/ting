# Copy to config.toml (gitignored) and edit before connecting.
# tng-master -config config.toml
# IRC servers, channels, owners, and SASL live in tng.db (admin UI).

database = "tng.db"
# connector = "dist/dev/tng-connector"

[identity]
nick = "tng"
user = "tng"
realname = "tng"

# Admin UI login. Required.
[control]
token = "change-me"

[admin]
listen = "127.0.0.1:8080"
